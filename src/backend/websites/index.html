<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Recommendations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        #input-product, #results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            text-align: center;
            width: 250px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .product-card img {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
        }
        .product-details {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<h1>Complete the Look Recommendation</h1>

<button id="submitBtn">Get Recommendations</button>

<div id="input-product"></div>
<h2>Recommended Compatible Products</h2>
<div id="results"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const submitBtn = document.getElementById('submitBtn');

        if (submitBtn) {
            submitBtn.addEventListener('click', async () => {
                try {
                    // הפונקציה תחפש עד שמוצר ימצא
                    async function fetchRecommendation() {
                        const productId = Math.floor(Math.random() * 40000) + 1;
                        const response = await fetch('http://localhost:5000/recommend', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ product_id: productId })
                        });

                        const data = await response.json();
                        console.log("Full Recommendation Data:", data);


                        if (!data.input_product || !data.recommended_compatible_products || data.recommended_compatible_products.length === 0) {
                            fetchRecommendation();
                            return;
                        }

                        // Display input product
                        const inputProductDiv = document.getElementById('input-product');
                        inputProductDiv.innerHTML = ''; // Clear existing content

                        const inputProductCard = document.createElement('div');
                        inputProductCard.classList.add('product-card');

                        if (data.input_product.image_path) {
                            const inputImg = document.createElement('img');
                            const imageFilename = data.input_product.image_path.split('/').pop();
                            inputImg.src = `http://localhost:5000/data/fashion_v2/train_single/${imageFilename}`;
                            inputImg.alt = data.input_product.product_type;

                            const inputProductDetails = document.createElement('div');
                            inputProductDetails.classList.add('product-details');
                            inputProductDetails.innerHTML = `
                                <p><strong>Input Product</strong></p>
                                <p>Type: ${data.input_product.product_type}</p>
                                <p>Product ID: ${data.input_product.product_id}</p>
                            `;

                            inputProductCard.appendChild(inputImg);
                            inputProductCard.appendChild(inputProductDetails);
                            inputProductDiv.appendChild(inputProductCard);
                        }

                        // Display recommended products
                        const resultsDiv = document.getElementById('results');
                        resultsDiv.innerHTML = ''; // Clear existing content

                        data.recommended_compatible_products.forEach(product => {
                            const productCard = document.createElement('div');
                            productCard.classList.add('product-card');

                            const img = document.createElement('img');
                            const imageFilename = product.image_path ? product.image_path.split('/').pop() : '';
                            img.src = imageFilename
                                ? `http://localhost:5000/data/fashion_v2/train_single/${imageFilename}`
                                : 'default-image-path.jpg'; // Default image

                            const productDetails = document.createElement('div');
                            productDetails.classList.add('product-details');
                            productDetails.innerHTML = `
                                <p><strong>${product.product_type}</strong></p>
                                <p>Product ID: ${product.product_id}</p>
                                <p>Compatibility Score: ${(product.compatibility_score * 100).toFixed(2)}%</p>
                            `;

                            productCard.appendChild(img);
                            productCard.appendChild(productDetails);
                            resultsDiv.appendChild(productCard);
                        });
                    }

                    fetchRecommendation();

                } catch (error) {
                    console.error('Error fetching recommendations:', error);
                }
            });
        } else {
            console.error('Submit button not found');
        }
    });
</script>

</body>
</html>
